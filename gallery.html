    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .gallery-grid img {
            width: 100%;
            border-radius: 15px;
            object-fit: cover;
            height: 220px;
            border: 1px solid rgba(255,255,255,.07);
            transition: .4s;
        }
        .gallery-grid img:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(138,79,255,.35);
        }
    </style>
</head>
